services:
  postgres:
    image: postgres:16
    container_name: postgres-dev
    shm_size: 128mb
    environment:
        POSTGRES_USER: authUser
        POSTGRES_PASSWORD: secret
        POSTGRES_DB: authDB
    ports:
        - 5432:5432
    volumes:
        - "auth_pgdata:/var/lib/postgresql/data"

  redis:
    image: redis:7
    container_name: auth-redis
    ports:
      - 6379:6379	

volumes:
    auth_pgdata: